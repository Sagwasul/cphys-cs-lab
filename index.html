          若你有固定域名，请把它替换成具体域名，收紧到最小集合。
        · 若你在设置里关闭了"第三方 CDN"，可以删掉 jsdelivr / esm.sh 两项。

      注意：这个 meta 版本在部分浏览器（尤其旧版 Safari）支持不完整。
