# 构建站点并发布到 GitHub Pages（每次推送到 main 触发）。
#
# 为什么用 Actions 而不是"直接发布分支目录"：
#   站点产物（app.js / app.css / manifest.json）由 pieces/ 拼接而成，
#   必须在发布前重新构建，否则会出现"源码改了、线上没变"。
#
# 关于 base 路径：app.js / app.css / manifest.json / content/ 全部用相对路径引用，
# 因此本工作流同时适用于
#   · 用户/组织主页   https://<user>.github.io/
#   · 项目子路径      https://<user>.github.io/<repo>/
# 不需要额外配置 base。

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建站点（拼接 pieces + 生成 manifest + 密钥扫描）
        run: npm run build

      - name: 运行全部测试（含大纲完整性与安全测试）
        run: npm test

      - name: 校验 manifest 与 content 同步
        run: node scripts/gen-manifest.mjs --check

      - name: 确定性自检说明
        # 产物确定性（同样的输入 → 逐字节相同的 app.js / app.css）
        # 已由 scripts/build.mjs 在其「3b. 确定性自检」里于内存中完成校验。
        # 这里刻意**不再**重复跑一次构建去 diff：那会重写 manifest.json，
        # 而 manifest 含 generatedAt 时间戳，diff 必然非零，
        # 会把"时间戳变了"误报成"构建不确定"，从而挡住整个发布（真实踩过这个坑）。
        run: echo "确定性已在构建脚本内部校验 ✓"

      - name: HTTP 冒烟测试（在真实 HTTP 下检查资源可访问性与 Content-Type）
        run: npm run smoke

      - name: 打包发布目录（只放产物，不发布源码）
        run: |
          mkdir -p dist
          cp index.html app.js app.css manifest.json dist/
          cp -r content dist/
          touch dist/.nojekyll
          ls -la dist
          echo "--- 发布目录内容 ---"
          find dist -type f | sort | head -60

      - name: 对发布目录再跑一次冒烟测试
        run: node scripts/smoke.mjs dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
